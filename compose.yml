services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    healthcheck:
      test: ["CMD-SHELL", "aws --endpoint-url=http://localhost:4566 sqs list-queues || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      cdp-tenant:
        aliases:
          - floci
          - sqs.eu-west-2.floci
          - s3.eu-west-2.floci

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ################################################################################

  grants-reporting-collector:
    build:
      context: .
      target: development
    ports:
      - '3001:3001'
    links:
      - 'floci:floci'
      - 'mongodb:mongodb'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3001
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/
      REPORTING_EVENTS_QUEUE_URL: 'http://sqs.eu-west-2.floci:4566/000000000000/gfr__sqs__grants_reporting_events'
      FEATURES_QUEUE_URL: 'http://sqs.eu-west-2.floci:4566/000000000000/gfr__sqs__rc_feature_control_updates.fifo'
    networks:
      - cdp-tenant
    volumes:
      - ./src:/home/node/src
      - .env:/home/node/.env
      - ./package.json:/home/node/package.json

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
    name: cdp-tenant
