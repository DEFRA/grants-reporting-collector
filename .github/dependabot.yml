version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Separate production and development dependency updates into their own PRs
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - 'minor'
          - 'patch'

      development-dependencies:
        dependency-type: development
        update-types:
          - 'minor'
          - 'patch'

    # Pin eslint to its current major (neostandard controls the version);
    # still allow minor/patch and security updates through
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']

    labels:
      - 'dependencies'

    schedule:
      interval: weekly
      day: monday

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Group all GitHub Actions bumps into a single PR
    groups:
      github-actions:
        patterns:
          - '*'

    ignore:
      - dependency-name: 'DEFRA/cdp-build-action/build'
      - dependency-name: 'DEFRA/cdp-build-action/build-hotfix'

    labels:
      - 'dependencies'

    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /

    labels:
      - 'dependencies'

    schedule:
      interval: weekly
      day: monday
